{% include base_path %}
<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  document.querySelectorAll('.presentation-card details').forEach(function (details) {
    details.addEventListener('toggle', function () {
      if (!details.open) return;
      var preview = details.querySelector('embed[data-src]');
      if (preview) {
        preview.src = preview.dataset.src;
        preview.removeAttribute('data-src');
      }
    }, { once: true });
  });

  var menuButton = document.querySelector('.greedy-nav button');
  if (menuButton) {
    menuButton.addEventListener('click', function () {
      window.setTimeout(function () {
        menuButton.setAttribute('aria-expanded', menuButton.classList.contains('close') ? 'true' : 'false');
      }, 0);
    });
  }
</script>
